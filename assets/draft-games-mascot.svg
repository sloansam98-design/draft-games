<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="mascotGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34f5a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34f5a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="duckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
  </defs>

  <!-- ground glow -->
  <ellipse cx="58" cy="128" rx="34" ry="7" fill="url(#mascotGlow)"/>

  <!-- tail -->
  <ellipse cx="18" cy="88" rx="10" ry="7" fill="#EDC72B" opacity="0.55" transform="rotate(-18 18 88)"/>

  <!-- body -->
  <ellipse cx="52" cy="92" rx="30" ry="18" fill="url(#duckBody)" stroke="#EDC72B" stroke-width="1.4"/>
  <ellipse cx="52" cy="94" rx="20" ry="9" fill="#EDC72B" opacity="0.22"/>

  <!-- ref shirt -->
  <path d="M28 84 C30 72 42 68 52 68 C62 68 74 72 76 84 C76 92 70 98 52 98 C34 98 28 92 28 84 Z" fill="#f4f6fa"/>
  <path d="M34 72 L38 98 M46 69 L48 98 M58 69 L60 98 M66 72 L70 98" stroke="#1a1f2e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M28 84 C34 88 42 90 52 90 C62 90 70 88 76 84" fill="none" stroke="#d8dde8" stroke-width="1"/>

  <!-- wing -->
  <ellipse cx="34" cy="86" rx="12" ry="8" fill="#FFC107" opacity="0.75" transform="rotate(-8 34 86)"/>

  <!-- head -->
  <circle cx="78" cy="58" r="22" fill="url(#duckBody)" stroke="#EDC72B" stroke-width="1.4"/>

  <!-- ref cap -->
  <path d="M58 48 C62 36 74 32 84 34 C94 36 98 44 96 50 C88 46 72 46 58 48 Z" fill="#1a1f2e"/>
  <path d="M56 48 C68 44 86 44 98 48 L98 52 C86 49 68 49 56 52 Z" fill="#2a3144"/>
  <ellipse cx="98" cy="50" rx="8" ry="3" fill="#2a3144"/>

  <!-- beak -->
  <ellipse cx="96" cy="62" rx="12" ry="7" fill="#FF8C00" stroke="#E07000" stroke-width="1"/>
  <ellipse cx="101" cy="61" rx="4" ry="2.5" fill="#FFB347" opacity="0.55"/>

  <!-- eye -->
  <circle cx="82" cy="52" r="4.2" fill="#111"/>
  <circle cx="83.4" cy="50.8" r="1.5" fill="#fff" opacity="0.85"/>

  <!-- whistle -->
  <circle cx="72" cy="68" r="3.2" fill="#c9cdd8" stroke="#9aa3b5" stroke-width="0.8"/>
  <path d="M75 68 L79 66" stroke="#9aa3b5" stroke-width="1.2" stroke-linecap="round"/>

  <!-- clipboard arm -->
  <path d="M66 78 C72 74 78 72 84 74" stroke="#EDC72B" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- clipboard -->
  <g transform="translate(84 58) rotate(8)">
    <rect x="0" y="0" width="28" height="36" rx="3" fill="#0a0e18" stroke="#34f5a8" stroke-width="1.4"/>
    <rect x="3" y="4" width="22" height="28" rx="2" fill="#121826"/>
    <rect x="11" y="-3" width="6" height="5" rx="1.5" fill="#34f5a8"/>
    <rect x="6" y="8" width="16" height="5" rx="1.5" fill="rgba(52,245,168,0.18)"/>
    <rect x="6" y="16" width="16" height="5" rx="1.5" fill="rgba(255,255,255,0.06)"/>
    <rect x="6" y="24" width="16" height="5" rx="1.5" fill="rgba(255,255,255,0.06)"/>
    <text x="14" y="12.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" font-weight="700" fill="#34f5a8">1</text>
    <text x="14" y="20.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6" font-weight="600" fill="#8b93a8">2</text>
    <text x="14" y="28.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6" font-weight="600" fill="#8b93a8">3</text>
  </g>

  <!-- foot -->
  <ellipse cx="46" cy="108" rx="9" ry="4" fill="#FF8C00" opacity="0.85"/>
  <ellipse cx="62" cy="108" rx="9" ry="4" fill="#FF8C00" opacity="0.85"/>
</svg>
