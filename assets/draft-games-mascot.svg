<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="orbBody" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="42%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#34f5a8"/>
    </linearGradient>
    <linearGradient id="orbShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="groundGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34f5a8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- orbit trails -->
  <ellipse cx="60" cy="68" rx="47" ry="14" fill="none" stroke="rgba(52,245,168,0.24)" stroke-width="1.2" transform="rotate(-16 60 68)"/>
  <ellipse cx="60" cy="68" rx="47" ry="14" fill="none" stroke="rgba(139,92,246,0.2)" stroke-width="1" transform="rotate(22 60 68)"/>

  <!-- shadow -->
  <ellipse cx="60" cy="124" rx="27" ry="6" fill="url(#groundGlow)"/>

  <!-- legs -->
  <path d="M49 98 C47 108 45 114 43 118" stroke="#1f2433" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M71 98 C73 108 75 114 77 118" stroke="#1f2433" stroke-width="5" stroke-linecap="round" fill="none"/>
  <ellipse cx="43" cy="119" rx="7" ry="3.8" fill="#121826"/>
  <ellipse cx="77" cy="119" rx="7" ry="3.8" fill="#121826"/>
  <path d="M40 118 H46 M74 118 H80" stroke="#34f5a8" stroke-width="2" stroke-linecap="round"/>

  <!-- left arm + chaos die -->
  <path d="M33 74 C22 70 16 58 14 48" stroke="#1f2433" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <g transform="translate(6 38) rotate(-18)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="url(#goldFace)" stroke="#c9a020" stroke-width="0.8"/>
    <circle cx="4" cy="4" r="1.2" fill="#1a1208"/>
    <circle cx="12" cy="4" r="1.2" fill="#1a1208"/>
    <circle cx="8" cy="8" r="1.2" fill="#1a1208"/>
    <circle cx="4" cy="12" r="1.2" fill="#1a1208"/>
    <circle cx="12" cy="12" r="1.2" fill="#1a1208"/>
  </g>

  <!-- body -->
  <circle cx="60" cy="68" r="34" fill="url(#orbBody)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
  <ellipse cx="47" cy="51" rx="15" ry="11" fill="url(#orbShine)" transform="rotate(-22 47 51)"/>

  <!-- chest bolt -->
  <path d="M58 82 L62 74 L60 74 L64 66 L60 76 L62 76 L58 84 Z" fill="#34f5a8" opacity="0.85"/>

  <!-- visor -->
  <path d="M38 62 C42 56 52 54 60 54 C68 54 78 56 82 62 C80 70 70 74 60 74 C50 74 40 70 38 62 Z" fill="#0a0e18" opacity="0.72"/>
  <path d="M40 63 C44 58 52 56 60 56 C68 56 76 58 80 63" stroke="rgba(52,245,168,0.35)" stroke-width="1" fill="none"/>

  <!-- eyes -->
  <circle cx="51" cy="64" r="3.2" fill="#34f5a8"/>
  <circle cx="52" cy="63" r="1.1" fill="#fff"/>
  <path d="M67 64 H74" stroke="#34f5a8" stroke-width="2.4" stroke-linecap="round"/>

  <!-- grin -->
  <path d="M53 78 Q60 84 68 77" stroke="#34f5a8" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- #1 tag -->
  <g transform="translate(60 33)">
    <rect x="-15" y="-7" width="30" height="14" rx="7" fill="#101522" stroke="#34f5a8" stroke-width="1.1"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#34f5a8">#1</text>
  </g>

  <!-- right arm + #1 trophy -->
  <path d="M87 75 C96 71 104 62 108 50" stroke="#1f2433" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <g transform="translate(90 26) rotate(8)">
    <ellipse cx="16" cy="10" rx="11" ry="3.2" fill="#ffe082" stroke="#c9a020" stroke-width="0.8"/>
    <path d="M7 10 C7 10 8 28 16 30 C24 28 25 10 25 10 Z" fill="url(#goldFace)" stroke="#c9a020" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M5 14 C2 14 1.5 21 5 22" stroke="#c9a020" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M27 14 C30 14 30.5 21 27 22" stroke="#c9a020" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M11 12 L21 12 L19.5 24 L12.5 24 Z" fill="#f5c842" opacity="0.35"/>
    <text x="16" y="22.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="900" fill="#5c4a12">#1</text>
    <rect x="12" y="30" width="8" height="3.5" rx="1" fill="#c9a020"/>
    <rect x="9" y="33.5" width="14" height="2.8" rx="1.2" fill="#9a7b18"/>
    <ellipse cx="16" cy="34" rx="8" ry="1.2" fill="#ffe082" opacity="0.55"/>
  </g>

  <!-- sparks -->
  <path d="M26 32 L28 26 L30 32 L36 34 L30 36 L28 42 L26 36 L20 34 Z" fill="#34f5a8" opacity="0.8"/>
  <path d="M90 98 L91.5 94 L93 98 L97 99.5 L93 101 L91.5 105 L90 101 L86 99.5 Z" fill="#8b5cf6" opacity="0.85"/>
</svg>
